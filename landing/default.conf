# Rootless static-site configuration for the BiciRadar landing page.
# The container runs as UID/GID 101 and can only bind unprivileged port 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    autoindex off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Security headers. Keep them at server level: adding add_header inside a
    # location would stop inheritance of these headers in that location.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloud.umami.is; media-src 'none'; worker-src 'none'; manifest-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Do not expose VCS metadata, dotfiles, or editor leftovers. The public
    # .well-known discovery documents remain reachable.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    # This is a static site: only read-only methods are needed.
    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    # Astro fingerprints files under /_astro/, so they can be cached forever.
    location /_astro/ {
        limit_except GET HEAD {
            deny all;
        }
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # HTML must revalidate so a new deployment is visible immediately.
    location ~* \.html$ {
        limit_except GET HEAD {
            deny all;
        }
        expires -1;
        try_files $uri =404;
    }
}
