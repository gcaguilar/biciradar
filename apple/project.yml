name: BiciRadar

configs:
  Debug: debug
  Release: release

options:
  autoCreateSchemes: false
  bundleIdPrefix: com.gcaguilar.biciradar
  createIntermediateGroups: true
  developmentLanguage: es
  knownRegions:
    - Base
    - es
    - en
    - ca
    - eu
    - gl
  deploymentTarget:
    iOS: "18.6"
    watchOS: "11.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 29570207
    MARKETING_VERSION: 0.22.18
    SWIFT_VERSION: "5.10"
    # The "Build KMP Swift export" phases run Gradle, which writes outside the declared
    # outputs; Xcode's user-script sandbox blocks that.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.18.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.0.0
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    exactVersion: 3.1.0

targets:
  BiciRadar:
    type: application
    platform: iOS
    deploymentTarget: "18.6"
    configFiles:
      Debug: Config/MapsConfig.xcconfig
      Release: Config/MapsConfig.xcconfig
    sources:
      - path: iosApp
      - path: sharedApple
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: UIKit.framework
      - sdk: ActivityKit.framework
      - sdk: BackgroundTasks.framework
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseMessaging
      - package: Auth0
        product: Auth0
      - package: GoogleMaps
        product: GoogleMaps
      - target: BiciRadarWidgets
        embed: true
      - target: BiciRadarWatch
        embed: true
    preBuildScripts:
      - name: Build KMP Swift export
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          if [[ "$PLATFORM_NAME" != *simulator* && "$PLATFORM_NAME" != iphoneos ]]; then
            echo "Unsupported destination platform '$PLATFORM_NAME' for BiciRadar."
            echo "Use an iPhone device or an iOS Simulator, not 'My Mac (Designed for iPad/iPhone)'."
            exit 1
          fi
          ./gradlew --no-configuration-cache :shared:ios-export:embedSwiftExportForXcode
    postBuildScripts:
      - name: Copy Compose Resources to app bundle
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          ./gradlew --no-configuration-cache :shared:mobile-ui:syncComposeResourcesForIos \
            -Pcompose.ios.resources.platform="$PLATFORM_NAME" \
            -Pcompose.ios.resources.configuration="$CONFIGURATION" \
            -Pcompose.ios.resources.archs="$ARCHS" \
            -Pkotlin.native.cocoapods.platform="$PLATFORM_NAME" \
            -Pkotlin.native.cocoapods.archs="$ARCHS" \
            -Pkotlin.native.cocoapods.configuration="$CONFIGURATION"
      - name: Upload Crashlytics dSYMs
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}.debug.dylib
        script: |
          set -euo pipefail
          if [[ "$PLATFORM_NAME" == *simulator* ]]; then
            echo "Skipping Crashlytics dSYM upload for simulator builds."
            exit 0
          fi
          plist_path="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ ! -f "$plist_path" ]; then
            echo "Skipping Crashlytics dSYM upload because GoogleService-Info.plist is not bundled."
            exit 0
          fi
          run_script=""
          for candidate in \
            "$SRCROOT/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" \
            "$SRCROOT/../SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" \
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          do
            if [ -x "$candidate" ]; then
              run_script="$candidate"
              break
            fi
          done
          if [ ! -x "$run_script" ]; then
            echo "Crashlytics run script not found. Checked:"
            printf ' - %s\n' \
              "$SRCROOT/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" \
              "$SRCROOT/../SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" \
              "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
            exit 1
          fi
          "$run_script"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: iosApp/BiciRadar.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: B87AWPVZWB
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "BiciRadarProfile"
        # The entitlement is expanded by Xcode from this setting, so Debug builds
        # register against APNs sandbox and Release builds against production.
        # A single hardcoded value cannot sign both: the distribution profile
        # only allows `production`.
        APS_ENVIRONMENT: development
        # Backend/Auth0 values come from Config/MapsConfig.xcconfig (which includes
        # the git-ignored LocalSecrets.xcconfig). Do not declare them here: build
        # settings override the xcconfig, and an empty value silently disables
        # login for every local build.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        OTHER_LDFLAGS: $(inherited) -ObjC -lShared -lsqlite3
        PRODUCT_BUNDLE_IDENTIFIER: com.gcaguilar.biciradar.ios
        PRODUCT_NAME: BiciRadar
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          APS_ENVIRONMENT: production

  BiciRadarWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.6"
    sources:
      - path: iosWidgets
      - path: sharedApple/BiziMonitoringActivityAttributes.swift
      - path: sharedApple/BiziSharedStorage.swift
      - path: sharedApple/BiziSurfaceStore.swift
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: CoreLocation.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: iosWidgets/BiciRadarWidgets.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: B87AWPVZWB
        PROVISIONING_PROFILE_SPECIFIER: "BiciRadarWidgetProfile"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcaguilar.biciradar.ios.widgets
        PRODUCT_NAME: BiciRadar Widgets

  BiciRadarTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.6"
    sources:
      - path: iosAppTests
    dependencies:
      - target: BiciRadar
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gcaguilar.biciradar.ios.tests
        PRODUCT_NAME: BiciRadar Tests

  BiciRadarWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: watchApp
      - path: watchShared
      - path: sharedApple/BiziSyncModels.swift
      - path: sharedApple/BiziShortcutDialogHelpers.swift
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WatchConnectivity.framework
      - sdk: libsqlite3.tbd
      - target: BiciRadarWatchWidgets
        embed: true
    preBuildScripts:
      - name: Build KMP Swift export
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          # When the watch app is built as part of an iPhone destination, Xcode exposes the
          # iPhone simulator as the target device; Swift export would then build the watch
          # package for iOS. Dropping it makes Gradle use the generic watchOS destination.
          env -u TARGET_DEVICE_IDENTIFIER -u TARGET_DEVICE_MODEL -u TARGET_DEVICE_OS_VERSION -u TARGET_DEVICE_PLATFORM_NAME \
            ./gradlew --no-configuration-cache :shared:watch-export:embedSwiftExportForXcode
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: watchApp/BiciRadarWatch.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: B87AWPVZWB
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "BiciRadarWatchProfile"
        ARCHS[sdk=watchos*]: "arm64 arm64_32"
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bici Radar Watch
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Bici Radar necesita tu ubicación para mostrar estaciones cercanas en el reloj.
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.gcaguilar.biciradar.ios
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        OTHER_LDFLAGS: $(inherited) -lSharedWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.gcaguilar.biciradar.ios.watch
        PRODUCT_NAME: BiciRadar Watch

  BiciRadarWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: watchWidgets
      - path: watchShared
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        AD_HOC_CODE_SIGNING_ALLOWED[sdk=watchsimulator*]: NO
        CODE_SIGN_ENTITLEMENTS: watchWidgets/BiciRadarWatchWidgets.entitlements
        CODE_SIGNING_ALLOWED[sdk=watchsimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=watchsimulator*]: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: B87AWPVZWB
        PROVISIONING_PROFILE_SPECIFIER: "BiciRadarWatchWidgetProfile"
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: watchWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gcaguilar.biciradar.ios.watch.widgets
        PRODUCT_NAME: BiciRadar Watch Widgets

  BiciRadarWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: watchAppTests
      - path: watchShared
      - path: watchApp/WatchFavoritesSyncBridge.swift
      - path: watchApp/BiziWatchGraph.swift
      - path: watchApp/WatchShortcutRunner.swift
      - path: watchApp/WatchDashboardModel.swift
      - path: sharedApple/BiziSyncModels.swift
      - path: sharedApple/BiziShortcutDialogHelpers.swift
    dependencies:
      - target: BiciRadarWatch
      - sdk: XCTest.framework
      - sdk: WatchConnectivity.framework
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: Build KMP Swift export (tests)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          if [[ "$PLATFORM_NAME" != *simulator* && "$PLATFORM_NAME" != watchos ]]; then
            echo "Unsupported destination platform '$PLATFORM_NAME' for BiciRadarWatchTests."
            echo "Use an Apple Watch device or a watchOS Simulator."
            exit 1
          fi
          env -u TARGET_DEVICE_IDENTIFIER -u TARGET_DEVICE_MODEL -u TARGET_DEVICE_OS_VERSION -u TARGET_DEVICE_PLATFORM_NAME \
            ./gradlew --no-configuration-cache :shared:watch-export:embedSwiftExportForXcode
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: $(inherited) -lSharedWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.gcaguilar.biciradar.ios.watch.tests
        PRODUCT_NAME: BiciRadar Watch Tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BiciRadar Watch.app/BiciRadar Watch"

schemes:
  BiciRadariOSTests:
    build:
      targets:
        BiciRadar: all
        BiciRadarWidgets: all
        BiciRadarTests: [testing]
    test:
      config: Debug
      targets:
        - BiciRadarTests
    run:
      config: Debug
  BiciRadar:
    build:
      targets:
        BiciRadar: all
        BiciRadarWidgets: all
        BiciRadarWatch: all
        BiciRadarTests: [testing]
    test:
      config: Debug
      targets:
        - BiciRadarTests
    run:
      config: Debug
  BiciRadarWatch:
    build:
      targets:
        BiciRadarWatch: all
        BiciRadarWatchWidgets: all
        BiciRadarWatchTests: [testing]
    test:
      config: Debug
      targets:
        - BiciRadarWatchTests
    run:
      config: Debug
