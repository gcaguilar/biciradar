name: Publish Android to Play

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - wear
      release_track:
        description: 'Play track to publish to'
        required: true
        default: 'closed_testing'
        type: choice
        options:
          - closed_testing
          - production
      closed_track:
        description: 'Closed testing track name (only used when release_track=closed_testing)'
        required: false
        default: 'alpha'
        type: string
      release_status:
        description: 'Release status (staged requires release_track=production and user_fraction)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - staged
      user_fraction:
        description: 'Staged rollout fraction, 0 < x < 1 (only used when release_status=staged)'
        required: false
        default: '0.1'
        type: string
      update_criticality:
        description: 'Android update criticality (0-5)'
        required: true
        default: '3'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Resolve Play track and release status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      track: ${{ steps.resolve.outputs.track }}
      wear_track: ${{ steps.resolve.outputs.wear_track }}
      status: ${{ steps.resolve.outputs.status }}
      user_fraction: ${{ steps.resolve.outputs.user_fraction }}
    steps:
      - id: resolve
        name: Validate and resolve inputs
        env:
          RELEASE_TRACK: ${{ github.event.inputs.release_track }}
          CLOSED_TRACK: ${{ github.event.inputs.closed_track }}
          RELEASE_STATUS: ${{ github.event.inputs.release_status }}
          USER_FRACTION: ${{ github.event.inputs.user_fraction }}
        run: |
          set -euo pipefail

          closed_track="${CLOSED_TRACK:-alpha}"
          if [[ ! "$closed_track" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::closed_track must be a lowercase Play track name (for example alpha or qa)"
            exit 1
          fi

          case "$RELEASE_TRACK" in
            production)
              track="production"
              ;;
            closed_testing)
              track="$closed_track"
              ;;
            *)
              echo "::error::release_track must be closed_testing or production"
              exit 1
              ;;
          esac

          case "$RELEASE_STATUS" in
            completed)
              status="completed"
              fraction=""
              ;;
            draft)
              status="draft"
              fraction=""
              ;;
            staged)
              status="inProgress"
              fraction="${USER_FRACTION:-}"
              if [[ "$RELEASE_TRACK" != "production" ]]; then
                echo "::error::Staged rollouts are only supported for release_track=production"
                exit 1
              fi
              if [[ ! "$fraction" =~ ^0\.[0-9]+$ ]]; then
                echo "::error::user_fraction must be greater than 0 and lower than 1 (for example 0.1)"
                exit 1
              fi
              ;;
            *)
              echo "::error::release_status must be completed, draft or staged"
              exit 1
              ;;
          esac

          {
            echo "track=$track"
            echo "wear_track=wear:$track"
            echo "status=$status"
            echo "user_fraction=$fraction"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Play publish plan"
            echo ""
            echo "| Target | Track | Status | User fraction |"
            echo "| --- | --- | --- | --- |"
            echo "| Android phone | \`$track\` | \`$status\` | ${fraction:-n/a} |"
            echo "| Wear OS | \`wear:$track\` | \`$status\` | ${fraction:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-android:
    name: Publish Android AAB to Play
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true

      - name: Resolve release version
        run: |
          release_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "RELEASE_TAG=${release_tag:-$(git rev-parse --short HEAD)}" >> "$GITHUB_ENV"
          echo "Building Android release: ${release_tag:-$(git rev-parse --short HEAD)}"

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          build-scan-terms-of-use-url: https://gradle.com/help/legal-terms-of-use
          build-scan-terms-of-use-agree: "yes"

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Write Android secrets
        env:
          BIZI_CI_KEYSTORE_BASE64: ${{ secrets.BIZI_CI_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_ANDROID }}
        run: |
          if [[ -z "$BIZI_CI_KEYSTORE_BASE64" ]]; then
            echo "::error::BIZI_CI_KEYSTORE_BASE64 secret is required"
            exit 1
          fi
          printf '%s' "$BIZI_CI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bizi-ci.keystore"
          if [[ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_ANDROID" > androidApp/google-services.json
          fi

      - name: Build Android release bundle
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
        run: |
          echo "Keystore path: ${{ runner.temp }}/bizi-ci.keystore"
          echo "Keystore exists: $(test -f '${{ runner.temp }}/bizi-ci.keystore' && echo 'yes' || echo 'no')"
          ./gradlew :androidApp:bundlePlaystoreRelease --no-build-cache \
            -PBIZI_CI_KEYSTORE_PATH="${{ runner.temp }}/bizi-ci.keystore" \
            -PBIZI_CI_KEYSTORE_PASSWORD="${{ secrets.BIZI_CI_KEYSTORE_PASSWORD }}" \
            -PBIZI_CI_KEY_ALIAS="${{ secrets.BIZI_CI_KEY_ALIAS }}" \
            -PBIZI_CI_KEY_PASSWORD="${{ secrets.BIZI_CI_KEY_PASSWORD }}"

      - name: Upload Android release bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-release-bundle
          if-no-files-found: error
          path: |
            androidApp/build/outputs/bundle/playstoreRelease/*.aab
            androidApp/build/outputs/mapping/playstoreRelease/mapping.txt

      - name: Prepare localized Android release notes
        run: |
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' androidApp/build.gradle.kts | head -n 1)
          notes_directory="$RUNNER_TEMP/android-whats-new"
          mkdir -p "$notes_directory"
          for locale in en-US es-ES; do
            source_file="fastlane/metadata/android/$locale/changelogs/$version_code.txt"
            if [[ ! -f "$source_file" ]]; then
              echo "::error::Missing Android release notes: $source_file"
              exit 1
            fi
            cp "$source_file" "$notes_directory/whatsnew-$locale"
          done
          echo "ANDROID_WHATS_NEW_DIR=$notes_directory" >> "$GITHUB_ENV"

      - name: Validate Android update criticality
        run: |
          priority="${{ github.event.inputs.update_criticality }}"
          if ! [[ "$priority" =~ ^[0-5]$ ]]; then
            echo "::error::update_criticality must be a single digit between 0 and 5"
            exit 1
          fi

      - name: Publish to Play Console
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.gcaguilar.biciradar
          releaseFiles: androidApp/build/outputs/bundle/playstoreRelease/*.aab
          mappingFile: androidApp/build/outputs/mapping/playstoreRelease/mapping.txt
          tracks: ${{ needs.prepare.outputs.track }}
          status: ${{ needs.prepare.outputs.status }}
          userFraction: ${{ needs.prepare.outputs.user_fraction }}
          releaseName: ${{ env.RELEASE_TAG }}
          inAppUpdatePriority: ${{ github.event.inputs.update_criticality }}
          whatsNewDirectory: ${{ env.ANDROID_WHATS_NEW_DIR }}

  publish-wear:
    name: Publish WearOS AAB to Play
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'wear'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true

      - name: Resolve release version
        run: |
          release_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "RELEASE_TAG=${release_tag:-$(git rev-parse --short HEAD)}" >> "$GITHUB_ENV"
          echo "Building Wear release: ${release_tag:-$(git rev-parse --short HEAD)}"

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          build-scan-terms-of-use-url: https://gradle.com/help/legal-terms-of-use
          build-scan-terms-of-use-agree: "yes"

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Write Wear secrets
        env:
          BIZI_CI_KEYSTORE_BASE64: ${{ secrets.BIZI_CI_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_WEAR: ${{ secrets.GOOGLE_SERVICES_JSON_WEAR }}
        run: |
          if [[ -z "$BIZI_CI_KEYSTORE_BASE64" ]]; then
            echo "::error::BIZI_CI_KEYSTORE_BASE64 secret is required"
            exit 1
          fi
          printf '%s' "$BIZI_CI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bizi-ci.keystore"
          if [[ -n "$GOOGLE_SERVICES_JSON_WEAR" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_WEAR" > wearApp/google-services.json
          fi

      - name: Build Wear release bundle
        run: |
          ./gradlew :wearApp:bundlePlaystoreRelease --no-build-cache \
            -PBIZI_CI_KEYSTORE_PATH="${{ runner.temp }}/bizi-ci.keystore" \
            -PBIZI_CI_KEYSTORE_PASSWORD="${{ secrets.BIZI_CI_KEYSTORE_PASSWORD }}" \
            -PBIZI_CI_KEY_ALIAS="${{ secrets.BIZI_CI_KEY_ALIAS }}" \
            -PBIZI_CI_KEY_PASSWORD="${{ secrets.BIZI_CI_KEY_PASSWORD }}"

      - name: Upload Wear release bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wear-release-bundle
          if-no-files-found: error
          path: |
            wearApp/build/outputs/bundle/playstoreRelease/*.aab
            wearApp/build/outputs/mapping/playstoreRelease/mapping.txt

      - name: Prepare localized Wear OS release notes
        run: |
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' wearApp/build.gradle.kts | head -n 1)
          notes_directory="$RUNNER_TEMP/wear-whats-new"
          mkdir -p "$notes_directory"
          for locale in en-US es-ES; do
            source_file="fastlane/metadata/android/$locale/changelogs/$version_code.txt"
            if [[ ! -f "$source_file" ]]; then
              echo "::error::Missing Wear OS release notes: $source_file"
              exit 1
            fi
            cp "$source_file" "$notes_directory/whatsnew-$locale"
          done
          echo "WEAR_WHATS_NEW_DIR=$notes_directory" >> "$GITHUB_ENV"

      - name: Publish WearOS to Play Console
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.gcaguilar.biciradar
          releaseFiles: wearApp/build/outputs/bundle/playstoreRelease/*.aab
          mappingFile: wearApp/build/outputs/mapping/playstoreRelease/mapping.txt
          tracks: ${{ needs.prepare.outputs.wear_track }}
          status: ${{ needs.prepare.outputs.status }}
          userFraction: ${{ needs.prepare.outputs.user_fraction }}
          releaseName: ${{ env.RELEASE_TAG }}
          whatsNewDirectory: ${{ env.WEAR_WHATS_NEW_DIR }}
