name: Publish Android to Play

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - wear
      release_track:
        description: 'Play track to publish to'
        required: true
        default: 'closed_testing'
        type: choice
        options:
          - closed_testing
          - production
      closed_track:
        description: 'Closed testing track name (only used when release_track=closed_testing)'
        required: false
        default: 'alpha'
        type: string
      release_status:
        description: 'Release status (staged requires release_track=production and user_fraction)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - staged
      user_fraction:
        description: 'Staged rollout fraction, 0 < x < 1 (only used when release_status=staged)'
        required: false
        default: '0.1'
        type: string
      update_criticality:
        description: 'Android update criticality (0-5)'
        required: true
        default: '3'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-play
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Play track and release status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.resolve.outputs.apps }}
      track: ${{ steps.resolve.outputs.track }}
      wear_track: ${{ steps.resolve.outputs.wear_track }}
      status: ${{ steps.resolve.outputs.status }}
      user_fraction: ${{ steps.resolve.outputs.user_fraction }}
    steps:
      - id: resolve
        name: Validate and resolve inputs
        env:
          TARGET: ${{ github.event.inputs.target }}
          RELEASE_TRACK: ${{ github.event.inputs.release_track }}
          CLOSED_TRACK: ${{ github.event.inputs.closed_track }}
          RELEASE_STATUS: ${{ github.event.inputs.release_status }}
          USER_FRACTION: ${{ github.event.inputs.user_fraction }}
          UPDATE_CRITICALITY: ${{ github.event.inputs.update_criticality }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            all|android|wear)
              ;;
            *)
              echo "::error::target must be all, android or wear"
              exit 1
              ;;
          esac

          closed_track="${CLOSED_TRACK:-alpha}"
          if [[ ! "$closed_track" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::closed_track must be a lowercase Play track name (for example alpha or qa)"
            exit 1
          fi

          case "$RELEASE_TRACK" in
            production)
              track="production"
              ;;
            closed_testing)
              track="$closed_track"
              ;;
            *)
              echo "::error::release_track must be closed_testing or production"
              exit 1
              ;;
          esac

          case "$RELEASE_STATUS" in
            completed)
              status="completed"
              fraction=""
              ;;
            draft)
              status="draft"
              fraction=""
              ;;
            staged)
              status="inProgress"
              fraction="${USER_FRACTION:-}"
              if [[ "$RELEASE_TRACK" != "production" ]]; then
                echo "::error::Staged rollouts are only supported for release_track=production"
                exit 1
              fi
              if [[ ! "$fraction" =~ ^0\.[0-9]+$ ]]; then
                echo "::error::user_fraction must be greater than 0 and lower than 1 (for example 0.1)"
                exit 1
              fi
              ;;
            *)
              echo "::error::release_status must be completed, draft or staged"
              exit 1
              ;;
          esac

          if [[ ! "$UPDATE_CRITICALITY" =~ ^[0-5]$ ]]; then
            echo "::error::update_criticality must be a single digit between 0 and 5"
            exit 1
          fi

          apps="$(jq -cn \
            --arg target "$TARGET" \
            --arg track "$track" \
            --arg wear_track "wear:$track" '
              [
                {
                  target: "android",
                  label: "Android phone",
                  module: "androidApp",
                  track: $track,
                  services_secret: "GOOGLE_SERVICES_JSON_ANDROID",
                  services_path: "androidApp/google-services.json",
                  update_criticality: true
                },
                {
                  target: "wear",
                  label: "Wear OS",
                  module: "wearApp",
                  track: $wear_track,
                  services_secret: "GOOGLE_SERVICES_JSON_WEAR",
                  services_path: "wearApp/google-services.json",
                  update_criticality: false
                }
              ]
              | map(select($target == "all" or .target == $target))
            ')"

          {
            echo "apps=$apps"
            echo "track=$track"
            echo "wear_track=wear:$track"
            echo "status=$status"
            echo "user_fraction=$fraction"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Play publish plan"
            echo ""
            echo "| Target | Track | Status | User fraction |"
            echo "| --- | --- | --- | --- |"
            jq -r --arg status "$status" --arg fraction "$fraction" \
              '.[] | "| \(.label) | `\(.track)` | `\($status)` | \(if $fraction == "" then "n/a" else $fraction end) |"' \
              <<< "$apps"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ matrix.label }} to Play
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.apps) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true

      - name: Resolve release version
        run: |
          release_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "RELEASE_TAG=${release_tag:-$(git rev-parse --short HEAD)}" >> "$GITHUB_ENV"
          echo "Building ${{ matrix.label }} release: ${release_tag:-$(git rev-parse --short HEAD)}"

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Write signing and Firebase assets
        env:
          BIZI_CI_KEYSTORE_BASE64: ${{ secrets.BIZI_CI_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets[matrix.services_secret] }}
        run: |
          if [[ -z "$BIZI_CI_KEYSTORE_BASE64" ]]; then
            echo "::error::BIZI_CI_KEYSTORE_BASE64 secret is required"
            exit 1
          fi
          printf '%s' "$BIZI_CI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bizi-ci.keystore"
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "${{ matrix.services_path }}"
          fi

      - name: Build release bundle
        env:
          GOOGLE_MAPS_API_KEY: ${{ matrix.target == 'android' && secrets.GOOGLE_MAPS_API_KEY_ANDROID || '' }}
        run: |
          echo "Keystore path: ${{ runner.temp }}/bizi-ci.keystore"
          echo "Keystore exists: $(test -f '${{ runner.temp }}/bizi-ci.keystore' && echo 'yes' || echo 'no')"
          ./gradlew :${{ matrix.module }}:bundlePlaystoreRelease --no-build-cache \
            -PBIZI_CI_KEYSTORE_PATH="${{ runner.temp }}/bizi-ci.keystore" \
            -PBIZI_CI_KEYSTORE_PASSWORD="${{ secrets.BIZI_CI_KEYSTORE_PASSWORD }}" \
            -PBIZI_CI_KEY_ALIAS="${{ secrets.BIZI_CI_KEY_ALIAS }}" \
            -PBIZI_CI_KEY_PASSWORD="${{ secrets.BIZI_CI_KEY_PASSWORD }}"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.target }}-release-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.module }}/build/outputs/bundle/playstoreRelease/*.aab
            ${{ matrix.module }}/build/outputs/mapping/playstoreRelease/mapping.txt

      - name: Prepare localized release notes
        run: |
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' "${{ matrix.module }}/build.gradle.kts" | head -n 1)
          if [[ -z "$version_code" ]]; then
            echo "::error::Could not read versionCode from ${{ matrix.module }}/build.gradle.kts"
            exit 1
          fi
          notes_directory="$RUNNER_TEMP/${{ matrix.target }}-whats-new"
          mkdir -p "$notes_directory"
          for locale in en-US es-ES; do
            source_file="fastlane/metadata/android/$locale/changelogs/$version_code.txt"
            if [[ ! -f "$source_file" ]]; then
              echo "::error::Missing release notes for ${{ matrix.label }}: $source_file"
              exit 1
            fi
            cp "$source_file" "$notes_directory/whatsnew-$locale"
          done
          echo "WHATS_NEW_DIR=$notes_directory" >> "$GITHUB_ENV"

      - name: Publish to Play Console
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.gcaguilar.biciradar
          releaseFiles: ${{ matrix.module }}/build/outputs/bundle/playstoreRelease/*.aab
          mappingFile: ${{ matrix.module }}/build/outputs/mapping/playstoreRelease/mapping.txt
          tracks: ${{ matrix.track }}
          status: ${{ needs.prepare.outputs.status }}
          userFraction: ${{ needs.prepare.outputs.user_fraction }}
          releaseName: ${{ env.RELEASE_TAG }}
          inAppUpdatePriority: ${{ matrix.update_criticality && github.event.inputs.update_criticality || '' }}
          whatsNewDirectory: ${{ env.WHATS_NEW_DIR }}
