name: Build and Test

on:
  pull_request:
    paths-ignore:
      - 'landing/**'
      - 'garminApp/**'
      - 'docs/**'
      - '**/*.md'
      - 'metadata/**'
      - 'fastlane/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'landing/**'
      - 'garminApp/**'
      - 'docs/**'
      - '**/*.md'
      - 'metadata/**'
      - 'fastlane/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      watch: ${{ steps.diff.outputs.watch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether watchOS is affected
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]]; then
            echo "watch=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: validating watchOS."
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "watch=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit: validating watchOS."
            exit 0
          fi

          if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt 2>/dev/null; then
            echo "watch=true" >> "$GITHUB_OUTPUT"
            echo "Cannot diff $BASE_SHA...$HEAD_SHA: validating watchOS."
            exit 0
          fi

          pattern='^(apple/|shared/|wearApp/|gradle/|tooling/generic-mobile-ci/|\.github/actions/|\.github/workflows/build\.yml$|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|gradlew|VERSION$|BUILD_NUMBER$)'
          if grep -qE "$pattern" changed-files.txt; then
            echo "watch=true" >> "$GITHUB_OUTPUT"
            echo "watchOS inputs changed:"
            grep -E "$pattern" changed-files.txt || true
          else
            echo "watch=false" >> "$GITHUB_OUTPUT"
            echo "No watchOS inputs changed; skipping the watchOS job."
          fi

  lint:
    name: Kotlin style
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          android-sdk: "false"

      - name: Run Kotlin style checks
        run: ./gradlew ktlintCheckAll

  android:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - name: Write Android Firebase config files
        env:
          GOOGLE_SERVICES_JSON_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_ANDROID }}
          GOOGLE_SERVICES_JSON_WEAR: ${{ secrets.GOOGLE_SERVICES_JSON_WEAR }}
          BIZI_CI_KEYSTORE_BASE64: ${{ secrets.BIZI_CI_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_ANDROID" > androidApp/google-services.json
          fi
          if [[ -n "$GOOGLE_SERVICES_JSON_WEAR" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_WEAR" > wearApp/google-services.json
          fi
          if [[ -n "$BIZI_CI_KEYSTORE_BASE64" ]]; then
            printf '%s' "$BIZI_CI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bizi-ci.keystore"
          fi

      - name: Run Android unit tests
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          BIZI_CI_KEYSTORE_PATH: ${{ runner.temp }}/bizi-ci.keystore
          BIZI_CI_KEYSTORE_PASSWORD: ${{ secrets.BIZI_CI_KEYSTORE_PASSWORD }}
          BIZI_CI_KEY_ALIAS: ${{ secrets.BIZI_CI_KEY_ALIAS }}
          BIZI_CI_KEY_PASSWORD: ${{ secrets.BIZI_CI_KEY_PASSWORD }}
        run: |
          if [[ -z "$GOOGLE_MAPS_API_KEY" ]]; then
            echo "::warning::GOOGLE_MAPS_API_KEY_ANDROID secret is empty — Google Maps will not work in this build"
          else
            echo "GOOGLE_MAPS_API_KEY is set (${#GOOGLE_MAPS_API_KEY} chars)"
          fi
          ./gradlew :shared:core:jvmTest :shared:mobile-ui:allTests :androidApp:testPlaystoreDebugUnitTest :wearApp:testPlaystoreDebugUnitTest

      - name: Build Android Play Store release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_ANDROID }}
          BICI_BACKEND_URL: ${{ secrets.BICI_BACKEND_URL }}
          BICI_AUTH0_DOMAIN: ${{ secrets.BICI_AUTH0_DOMAIN }}
          BICI_AUTH0_CLIENT_ID: ${{ secrets.BICI_AUTH0_CLIENT_ID_ANDROID }}
          BICI_AUTH0_AUDIENCE: ${{ secrets.BICI_AUTH0_AUDIENCE }}
          BIZI_CI_KEYSTORE_PATH: ${{ runner.temp }}/bizi-ci.keystore
          BIZI_CI_KEYSTORE_PASSWORD: ${{ secrets.BIZI_CI_KEYSTORE_PASSWORD }}
          BIZI_CI_KEY_ALIAS: ${{ secrets.BIZI_CI_KEY_ALIAS }}
          BIZI_CI_KEY_PASSWORD: ${{ secrets.BIZI_CI_KEY_PASSWORD }}
        run: |
          if [[ -z "$GOOGLE_MAPS_API_KEY" ]]; then
            echo "::warning::GOOGLE_MAPS_API_KEY_ANDROID secret is empty — Google Maps will not work in this build"
          else
            echo "GOOGLE_MAPS_API_KEY is set (${#GOOGLE_MAPS_API_KEY} chars)"
          fi
          if [[ -z "$BICI_AUTH0_DOMAIN" ]]; then
            echo "::warning::Auth0 secrets are not configured — this release build has login disabled"
          fi
          ./gradlew :androidApp:assemblePlaystoreRelease :wearApp:assemblePlaystoreRelease

      - name: Upload Android test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-test-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            androidApp/build/reports/tests/**
            androidApp/build/test-results/**
            wearApp/build/reports/tests/**
            wearApp/build/test-results/**
            shared/mobile-ui/build/reports/tests/**
            shared/mobile-ui/build/test-results/**
            shared/core/build/reports/tests/**
            shared/core/build/test-results/**

  ios:
    name: iOS build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache Xcode DerivedData (iOS)
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/derived-data-ios
          key: xcode-derived-ios-${{ runner.os }}-${{ hashFiles('apple/**/*.pbxproj', 'apple/project.yml') }}
          restore-keys: |
            xcode-derived-ios-${{ runner.os }}-

      - name: Write iOS secrets
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_IOS }}
        run: |
          printf 'GOOGLE_MAPS_IOS_API_KEY = %s\n' "$GOOGLE_MAPS_API_KEY" > apple/Config/LocalSecrets.xcconfig
          if [[ -n "$GOOGLE_SERVICE_INFO_PLIST" ]]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > apple/iosApp/GoogleService-Info.plist
          fi

      - name: Resolve iOS simulator destination
        run: |
          destination="$(./tooling/generic-mobile-ci/resolve_xcode_destination.sh ios)"
          echo "Using iOS destination: $destination"
          {
            echo 'IOS_DESTINATION<<EOF'
            echo "$destination"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Build iOS tests
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          xcodebuild \
            -project apple/BiciRadar.xcodeproj \
            -scheme BiciRadariOSTests \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/derived-data-ios" \
            -resultBundlePath "$RUNNER_TEMP/ios-build.xcresult" \
            build-for-testing

      - name: Run iOS tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          xcodebuild \
            -project apple/BiciRadar.xcodeproj \
            -scheme BiciRadariOSTests \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/derived-data-ios" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            test

      - name: Upload iOS test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-build.xcresult

  watchos:
    name: watchOS build and tests
    needs: changes
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache Xcode DerivedData (watchOS)
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/derived-data-watchos
          key: xcode-derived-watchos-${{ runner.os }}-${{ hashFiles('apple/**/*.pbxproj', 'apple/project.yml') }}
          restore-keys: |
            xcode-derived-watchos-${{ runner.os }}-

      - name: Resolve watchOS simulator destination
        run: |
          destination="$(./tooling/generic-mobile-ci/resolve_xcode_destination.sh watchos)"
          echo "Using watchOS destination: $destination"
          {
            echo 'WATCHOS_DESTINATION<<EOF'
            echo "$destination"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Run watchOS tests
        run: |
          xcodebuild \
            -project apple/BiciRadar.xcodeproj \
            -scheme BiciRadarWatch \
            -sdk watchsimulator \
            -destination "$WATCHOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/derived-data-watchos" \
            -resultBundlePath "$RUNNER_TEMP/watchos-tests.xcresult" \
            test

      - name: Upload watchOS test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: watchos-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/watchos-tests.xcresult
